[project]
name = "spurious-probes"
version = "0.1.0"
description = "Spurious probes: unrelated questions whose answers reveal whether a model thinks it is being evaluated"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "openai>=3.14.1",
    "httpx",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyarrow",
    "pyyaml",
    "python-dotenv",
    "huggingface_hub",
]

[project.optional-dependencies]
data = ["inspect_ai", "docent-python>=0.1.86", "boto3"]   # ImpossibleBench logs, the SWE-bench Verified export, SWE-Marathon
activations = ["torch", "transformers", "peft"]            # residual-stream readouts of open models

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spurious_probes"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
